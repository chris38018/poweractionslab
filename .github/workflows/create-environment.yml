name: Create Dev Test and Prod Environments
# clean up the environment for the next demo
#  clean up environment tasks for QA and Prod 

on:
  workflow_dispatch:
    inputs:
    
     env_name:
       description: name for the environment to be created
       required: true
       default: GitHubActionsDemo
     
     client_id:
       description: service principal client id
       required: true
       default: '9e4f94ec-87a5-4828-9622-599468558148'
      
     user_id:
       description: AAD object id for the user
       required: true
       default: ae70aeb6-423a-4461-bd8d-9f81f0ee1c8c

     domain:
       description: domain used with your environment 
       required: true
       default: GitHubActionsDemo
   
 #Do Not change these values
#permissions:
  #contents: write      

jobs:
 
  Create-Environments:
    runs-on: windows-latest
    # or you can say runs-on: ubuntu-latest
    env:
      RUNNER_DEBUG: 1

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
        
    #- name: Script
     # run: ./script.ps1
      #shell: pwsh
      
    - name: Install Power Platform Tools
      uses: microsoft/powerplatform-actions/actions-install@v1
      
    - name: Create Developer Environment
      uses: microsoft/powerplatform-actions/create-environment@v1
      with:
        app-id: '0f1aaa86-6311-4b76-ad49-cbc028f3096f'
        client-secret: ${{ secrets.DEV_APP_SECRET }}
        tenant-id: '65f3cfd5-0a49-4a5e-8bf4-f8ca438a9fda'
        name: ${{ github.event.inputs.env_name}}_DEV
        type: Developer
        domain: ${{ github.event.inputs.env_name}}Dev
        user: '46a71f9e-875a-4a1c-ba7e-b2aa08018d36'
    
    - name: assign-user to Developer environment
      uses:  microsoft/powerplatform-actions/assign-user@v1
      with:
        app-id: '0f1aaa86-6311-4b76-ad49-cbc028f3096f'
        client-secret: ${{ secrets.DEV_APP_SECRET }}
        tenant-id: '65f3cfd5-0a49-4a5e-8bf4-f8ca438a9fda'
        environment: 'https://${{ github.event.inputs.env_name}}Dev.crm.dynamics.com'
        user: ${{ github.event.inputs.user_id}}
        role: System Administrator
        
